name: Lint

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r frigate-face-bridge/requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile frigate-face-bridge/app/*.py
      - name: Run tests
        run: pytest -q
