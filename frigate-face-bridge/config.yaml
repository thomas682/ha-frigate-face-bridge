name: Frigate Face Bridge
version: "0.2.0"
slug: frigate_face_bridge
description: Lokale Personenzaehlung und Gesichtserkennung fuer UniFi-Kameras mit MQTT-Anbindung.
url: "https://github.com/thomas682/ha-frigate-face-bridge"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:face-recognition"
panel_title: "Face Bridge"
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Optionaler direkter Zugriff auf Web UI / REST API ohne Ingress. Standard: deaktiviert."
host_network: false
privileged: []
options:
  demo_mode: true
  log_level: info
  event_interval_seconds: 10
  mqtt:
    enabled: true
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
    topic_prefix: ha/frigate_face_bridge
  camera:
    name: garage_g3_flex
    host: 192.168.2.241
    rtsp_url: ""
    snapshot_url: ""
    detect_width: 640
    detect_height: 360
    detect_fps: 5
  known_faces:
    - name: Thomas
      enabled: true
    - name: Birgit
      enabled: true
    - name: Marie
      enabled: true
schema:
  demo_mode: bool
  log_level: list(trace|debug|info|warning|error)
  event_interval_seconds: int
  mqtt:
    enabled: bool
    host: str
    port: port
    username: str?
    password: password?
    topic_prefix: str
  camera:
    name: str
    host: str?
    rtsp_url: str?
    snapshot_url: str?
    detect_width: int
    detect_height: int
    detect_fps: int
  known_faces:
    - name: str
      enabled: bool
