name: Frigate Face Bridge
version: "0.12.0"
slug: frigate_face_bridge
description: Lokale Personenzaehlung und Gesichtserkennung fuer UniFi-Kameras mit MQTT-Anbindung.
url: "https://github.com/thomas682/ha-frigate-face-bridge"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:face-recognition"
panel_title: "Face Bridge"
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Optionaler direkter Zugriff auf Web UI / REST API ohne Ingress. Standard: deaktiviert."
host_network: false
privileged: []
options:
  demo_mode: true
  log_level: info
  event_interval_seconds: 10
  mqtt:
    enabled: true
    host: core-mosquitto
    port: 1883
    username: ""
    password: ""
    topic_prefix: ha/frigate_face_bridge
    discovery: true
    discovery_prefix: homeassistant
  frigate:
    enabled: false
    events_topic: frigate/events
    camera_name: ""
    api_url: ""
    person_count_enabled: true
    person_count_interval_seconds: 5
    dog_name: Maja
  face_recognition:
    enabled: false
    events_topic: face_recognition/events
    min_confidence: 0.7
  terrace_door:
    enabled: false
    open: false
    confidence: 0.0
    last_changed: ""
  camera:
    name: garage_g3_flex
    host: 192.168.2.241
    rtsp_url: ""
    snapshot_url: ""
    detect_width: 640
    detect_height: 360
    detect_fps: 5
  known_faces:
    - name: Thomas
      enabled: true
    - name: Birgit
      enabled: true
    - name: Marie
      enabled: true
schema:
  demo_mode: bool
  log_level: list(trace|debug|info|warning|error)
  event_interval_seconds: int
  mqtt:
    enabled: bool
    host: str
    port: port
    username: str?
    password: password?
    topic_prefix: str
    discovery: bool
    discovery_prefix: str
  frigate:
    enabled: bool
    events_topic: str
    camera_name: str?
    api_url: str?
    person_count_enabled: bool
    person_count_interval_seconds: int
    dog_name: str
  face_recognition:
    enabled: bool
    events_topic: str
    min_confidence: float
  terrace_door:
    enabled: bool
    open: bool
    confidence: float
    last_changed: str?
  camera:
    name: str
    host: str?
    rtsp_url: str?
    snapshot_url: str?
    detect_width: int
    detect_height: int
    detect_fps: int
  known_faces:
    - name: str
      enabled: bool
